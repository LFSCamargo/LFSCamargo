<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="720" height="280" rx="18" fill="url(#glass)" stroke="#1e3a5f" stroke-width="2"/>
  <circle cx="28" cy="24" r="6" fill="#f87171"/>
  <circle cx="50" cy="24" r="6" fill="#fbbf24"/>
  <circle cx="72" cy="24" r="6" fill="#34d399"/>
  <text x="100" y="29" fill="#64748b" font-family="ui-monospace, Menlo, Monaco, Consolas, monospace" font-size="13">luiz@thelittleluiz  zsh</text>

  <text x="28" y="72" fill="#38bdf8" font-family="ui-monospace, Menlo, Monaco, Consolas, monospace" font-size="15">$ whoami</text>
  <text x="28" y="98" fill="#e2e8f0" font-family="ui-monospace, Menlo, Monaco, Consolas, monospace" font-size="15">
    luiz fernando · senior software engineer
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.08;0.18;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <text x="28" y="136" fill="#38bdf8" font-family="ui-monospace, Menlo, Monaco, Consolas, monospace" font-size="15">
    $ cat mission.txt
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.22;0.3;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="28" y="162" fill="#86efac" font-family="ui-monospace, Menlo, Monaco, Consolas, monospace" font-size="15">
    ship the hard thing. make it feel inevitable.
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.34;0.44;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <text x="28" y="200" fill="#38bdf8" font-family="ui-monospace, Menlo, Monaco, Consolas, monospace" font-size="15">
    $ echo $FOCUS
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.58;1" dur="12s" repeatCount="indefinite"/>
  </text>
  <text x="28" y="226" fill="#93c5fd" font-family="ui-monospace, Menlo, Monaco, Consolas, monospace" font-size="15">
    fintech · ai agents · web3 · gaming · developer tooling
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.72;1" dur="12s" repeatCount="indefinite"/>
  </text>

  <rect x="28" y="248" width="9" height="16" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
